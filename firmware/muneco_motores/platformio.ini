[env:esp32dev]
platform = espressif32
; ESP32 NodeMCU de 30 pines (NodeMCU-32S)
board = nodemcu-32s
framework = arduino

; Distribucion ROS 2 (humble en este caso)
board_microros_distro = humble

; Transporte micro-ROS: serial (USB)
board_microros_transport = serial

; Puerto serie para flashear/monitorear
upload_port = /dev/ttyUSB0
upload_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_speed = 115200

; Librerias (los servos van directo a GPIO con LEDC, sin PCA9685)
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

build_flags =
    -D MICRO_ROS_TRANSPORT_ARDUINO_SERIAL=1

monitor_filters = esp32_exception_decoder
